services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 10

  api:
    build: .
    profiles: ["full"]          # `docker compose --profile full up` pour lancer aussi l'API
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      READER_DATABASE_URL: postgresql+psycopg://rag_reader:rag_reader@db:5432/rag
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf-cache:
