name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
      TEST_APP_DATABASE_URL: postgresql+psycopg://rag_app:rag_app@localhost:5432/rag
      TEST_READER_DATABASE_URL: postgresql+psycopg://rag_reader:rag_reader@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - name: Preparer la base comme sur Azure (role rag sans privilege de superutilisateur)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d rag -v ON_ERROR_STOP=1 -c "CREATE EXTENSION vector" -c "CREATE ROLE rag LOGIN CREATEROLE PASSWORD 'rag'" -c "ALTER DATABASE rag OWNER TO rag" -c "ALTER SCHEMA public OWNER TO rag"
          PGPASSWORD=rag psql -h localhost -U rag -d rag -v reader_password=rag_reader -v app_password=rag_app -f infra/init_db.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dependances (torch CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check app tests scripts eval --exclude app/parsers
      - name: Tests (sans LLM ; l'isolation entre utilisateurs est testee sur PostgreSQL)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image (ghcr.io exige des minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build de l'image (publiee seulement depuis main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Build de l'image Ollama (meme paquet ghcr, tag ollama-*)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ollama
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:ollama-${{ github.sha }}
            ${{ env.IMAGE }}:ollama-latest
          cache-from: type=gha,scope=ollama
          cache-to: type=gha,scope=ollama,mode=max,ignore-error=true
