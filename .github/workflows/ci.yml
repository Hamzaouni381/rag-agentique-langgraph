name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dependances (torch CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check app tests scripts eval --exclude app/parsers
      - name: Tests unitaires (sans LLM ni base)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image
        run: docker build -t rag-v2:${{ github.sha }} .
