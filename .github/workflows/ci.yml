name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dependances (torch CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check app tests scripts eval --exclude app/parsers
      - name: Tests unitaires (sans LLM ni base)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image (ghcr.io exige des minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build de l'image (publiee seulement depuis main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Build de l'image Ollama (meme paquet ghcr, tag ollama-*)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ollama
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:ollama-${{ github.sha }}
            ${{ env.IMAGE }}:ollama-latest
          cache-from: type=gha,scope=ollama
          cache-to: type=gha,scope=ollama,mode=max,ignore-error=true
